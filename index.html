<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"></head><body>
<title>奇異單據工坊</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
/* Layout: three working columns — document shelf, the form you fill, and the A4 sheet on a desk. The sheet stays paper-white in both themes. */
:root{
  --bg:#EDF1EF; --surface:#FFFFFF; --surface-2:#F5F8F7; --line:#D3DCD9; --fg:#1A2624; --muted:#5B6C68;
  --accent:#1F5C63; --accent-fg:#FFFFFF; --accent-soft:#DCEBEA; --desk:#DCE3E1;
  --seal:#C4382F; --ok:#2E7D4F; --ok-soft:#DFF1E6; --err:#B3392F; --err-soft:#F8E1DE; --warn:#8A5A00; --warn-soft:#FBEFD5;
  --paper:#FFFFFF; --ink:#1E1E1E; --ink-2:#555B5A; --rule:#CBD2D0; --tint:#F3F6F5;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111816; --surface:#19221F; --surface-2:#1E2926; --line:#2D3A37; --fg:#E2EBE8; --muted:#93A6A1;
  --accent:#6CB8B6; --accent-fg:#0D1615; --accent-soft:#1F3534; --desk:#0C1210;
  --seal:#E0584E; --ok:#6CC892; --ok-soft:#173326; --err:#F0857B; --err-soft:#3A1D1A; --warn:#E8B85A; --warn-soft:#352A12;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111816; --surface:#19221F; --surface-2:#1E2926; --line:#2D3A37; --fg:#E2EBE8; --muted:#93A6A1;
  --accent:#6CB8B6; --accent-fg:#0D1615; --accent-soft:#1F3534; --desk:#0C1210;
  --seal:#E0584E; --ok:#6CC892; --ok-soft:#173326; --err:#F0857B; --err-soft:#3A1D1A; --warn:#E8B85A; --warn-soft:#352A12;
  color-scheme:dark}

html,body{height:100%}
[hidden]{display:none!important}
body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.5}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{height:100%;display:grid;grid-template-rows:auto 1fr;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
.bar{display:flex;align-items:center;gap:12px;padding-block:12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto;min-width:0}
.brand h1{font-family:var(--serif);font-weight:900;font-size:20px;margin:0;letter-spacing:.04em}
.co-switch{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:13px;max-width:100%;min-width:0;cursor:pointer}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn-primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:700}
.btn-primary:hover{filter:brightness(1.08)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn-ghost:hover{color:var(--fg);border-color:var(--line)}
.btn[disabled]{opacity:.55;cursor:progress}
.btn-sm{padding:4px 9px;font-size:12px}

.main{display:grid;grid-template-columns:184px minmax(330px,410px) minmax(0,1fr);gap:16px;min-height:0;padding-block:14px 16px}
.shelf,.form-panel,.preview-panel{min-height:0;overflow:auto}
.shelf{display:flex;flex-direction:column;gap:4px}
.shelf .grp{font-size:11px;letter-spacing:.12em;color:var(--muted);margin:10px 8px 4px;text-transform:uppercase}
.tab{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;border:1px solid transparent;background:transparent;border-radius:8px;padding:9px 10px;cursor:pointer}
.tab:hover{background:var(--surface)}
.tab[aria-selected="true"]{background:var(--surface);border-color:var(--line);font-weight:700}
.tab[aria-selected="true"] .code{color:var(--accent)}
.tab .code{font-family:var(--mono);font-size:11px;color:var(--muted)}
.shelf-foot{margin-top:auto;font-size:12px;color:var(--muted);padding:10px 8px;line-height:1.6}
.shelf-foot a{color:var(--accent)}

.form-panel{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.fp-head{position:sticky;top:0;z-index:2;background:var(--surface);display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.fp-head h2{font-size:15px;margin:0 auto 0 0}
.fp-body{padding:12px 14px 24px;display:flex;flex-direction:column;gap:14px}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.06em;padding-top:6px;border-top:1px dashed var(--line)}
.sec:first-child .sec-h{border-top:0;padding-top:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld.full{grid-column:1/-1}
.fld label{font-size:12px;color:var(--muted)}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line);border-radius:7px;background:var(--surface-2);padding:6px 9px;min-width:0}
.fld textarea{min-height:64px;resize:vertical;line-height:1.55}
.fld input[type=number]{font-variant-numeric:tabular-nums}
.chk{display:flex;align-items:flex-start;gap:8px;font-size:13px;grid-column:1/-1;cursor:pointer}
.chk input{margin-top:3px}
.item{border:1px solid var(--line);border-radius:9px;padding:10px;background:var(--surface-2);display:flex;flex-direction:column;gap:8px}
.item .grid2 .fld input{background:var(--surface)}
.item-h{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);font-family:var(--mono)}
.x{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:2px 6px;border-radius:6px}
.x:hover{color:var(--err);background:var(--err-soft)}
.hint{font-size:12px;color:var(--muted);line-height:1.6}
.flbl{font-size:12px;color:var(--muted)}
.imgf{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.imgf img,.imgf .noimg{width:56px;height:56px;border-radius:7px;border:1px solid var(--line);background:#fff;object-fit:contain;flex:0 0 auto}
.imgf .noimg{display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted);background:var(--surface);border-style:dashed}
.alldisc{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--accent-soft);border-radius:9px;padding:8px 10px;font-size:13px}
.alldisc input{width:76px;border:1px solid var(--line);border-radius:7px;background:var(--surface);padding:5px 8px}
.calc{font-size:12.5px;background:var(--accent-soft);border-radius:8px;padding:8px 10px;line-height:1.7;font-variant-numeric:tabular-nums}
.calc b{font-family:var(--mono)}
.sample{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--warn-soft);color:var(--warn)}

.preview-panel{background:var(--desk);border-radius:12px;display:flex;flex-direction:column}
.pv-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--desk);flex-wrap:wrap}
.pv-head .lbl{font-size:12px;color:var(--muted);margin-right:auto}
.status{flex:1 0 100%;margin:0;padding:8px 12px;border-radius:8px;font-size:13px;line-height:1.6}
.status.info{background:var(--accent-soft)}
.status.ok{background:var(--ok-soft);color:var(--ok)}
.status.err{background:var(--err-soft);color:var(--err)}
.status a{color:inherit;font-weight:700}
.fit{padding:12px 14px 40px;display:flex;justify-content:center}
.fit-box{position:relative;overflow:hidden;flex:0 0 auto}
.fit-box .paper{position:absolute;top:0;left:0;transform-origin:0 0;box-shadow:0 1px 2px rgba(0,0,0,.08),0 8px 28px rgba(0,0,0,.12)}

.seg{display:none}
@media (max-width:980px){
  .main{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr);gap:10px}
  .shelf{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:2px}
  .shelf .grp,.shelf-foot{display:none}
  .tab{flex:0 0 auto;border-color:var(--line);background:var(--surface)}
  .tab .code{display:none}
  .seg{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:3px}
  .seg button{flex:1;border:0;background:transparent;border-radius:7px;padding:6px;cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);font-weight:700}
  .main[data-view="form"] .preview-panel{display:none}
  .main[data-view="preview"] .form-panel{display:none}
}
@media (max-width:440px){.grid2{grid-template-columns:1fr}.brand{flex-wrap:wrap}}

/* modal */
.modal{position:fixed;inset:0;background:rgba(10,20,18,.45);display:flex;align-items:flex-start;justify-content:center;z-index:30;overflow:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:14px;width:min(640px,100%);display:flex;flex-direction:column}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet-h h3{margin:0;font-size:16px}
.sheet-b{padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.sheet-f{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.seal-row{display:flex;gap:12px;align-items:center}
.seal-row img{width:64px;height:64px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:8px;padding:4px;flex:0 0 auto}
.seal-row .fld{flex:1}
.seal-row img[src=""]{visibility:hidden}
details summary{cursor:pointer;font-size:13px;color:var(--muted)}
.hist{display:flex;flex-direction:column;gap:8px}
.pl-sheet{width:min(760px,100%)}
.pl-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pl-tools input[type=search]{flex:1 1 220px;min-width:0;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);padding:8px 10px}
.pl-disc{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.pl-disc input{width:72px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);padding:7px 8px}
.pl-chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 11px;font-size:12.5px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:700}
.pl-list{display:flex;flex-direction:column;gap:14px}
.pl-sh{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.06em;padding:4px 0;border-bottom:1px solid var(--line);margin-bottom:6px}
.pl-name{display:flex;align-items:center;gap:10px;margin:8px 0 4px}
.pl-name img{width:40px;height:40px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:6px;flex:0 0 auto}
.pl-row{display:grid;grid-template-columns:22px minmax(64px,1fr) minmax(96px,1.4fr) 100px 70px;gap:8px;align-items:center;padding:6px 8px 6px 50px;border-radius:8px;cursor:pointer;font-variant-numeric:tabular-nums}
.pl-row:hover{background:var(--surface-2)}
.pl-row.on{background:var(--accent-soft)}
.pl-c{font-family:var(--mono);font-size:11.5px;color:var(--muted);overflow-wrap:anywhere}
.pl-p{text-align:right;font-weight:700}
.pl-q{width:100%;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:4px 6px}
.pl-q:disabled{opacity:.4}
.pl-foot{align-items:center;flex-wrap:wrap;position:sticky;bottom:0;background:var(--surface);border-radius:0 0 14px 14px}
@media (max-width:560px){.pl-row{grid-template-columns:22px 1fr 90px 56px;padding-left:8px}.pl-c{display:none}}
.hist-row{border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:var(--surface-2);display:flex;flex-direction:column;gap:3px}
.hist-row .t{font-weight:700;overflow-wrap:anywhere}
.hist-row .m{font-size:12px;color:var(--muted)}
.hist-row .l{display:flex;gap:12px;font-size:13px}
.hist-row a{color:var(--accent)}
.empty{color:var(--muted);text-align:center;padding:28px 10px;line-height:1.8}
#capture{position:fixed;left:-12000px;top:0;width:794px;pointer-events:none}

/* ========== the A4 sheet (fixed paper colours in both themes) ========== */
.paper{width:794px;min-height:1123px;background:var(--paper);color:var(--ink);padding:54px 58px 60px;font-family:var(--sans);font-size:12.5px;line-height:1.65}
.paper *{box-sizing:border-box}
.doc{display:flex;flex-direction:column;gap:18px}
.dh{display:flex;justify-content:space-between;gap:24px;padding-bottom:14px;border-bottom:2px solid var(--brand,#1F5C63)}
.dh-co{display:flex;gap:12px;min-width:0}
.dh-co img{flex:0 0 auto}
.dh-co .nm{font-size:19px;font-weight:700;letter-spacing:.02em;line-height:1.3}
.dh-co .en{font-size:10px;letter-spacing:.14em;color:var(--ink-2);margin-bottom:4px}
.dh-co .ln{font-size:11px;color:var(--ink-2);line-height:1.6}
.dh-t{text-align:right;flex:0 0 auto}
.dh-t .zh{font-family:var(--serif);font-weight:900;font-size:28px;letter-spacing:.3em;margin-right:-.3em;color:var(--brand,#1F5C63);line-height:1.2}
.dh-t .en2{font-size:10px;letter-spacing:.2em;color:var(--ink-2);margin:2px 0 8px}
.dh-t .mt{font-size:11.5px;line-height:1.7}
.dh-t .mt b{font-family:var(--mono);font-weight:500}
.box{background:var(--tint);border-radius:6px;padding:12px 14px}
.box .cap{font-size:11px;font-weight:700;color:var(--brand,#1F5C63);letter-spacing:.08em;margin-bottom:6px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:3px 22px}
.kv div{min-width:0;overflow-wrap:anywhere}
.kv .w{grid-column:1/-1}
.kv span{color:var(--ink-2);margin-right:6px}
table.t{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.t th{background:var(--brand,#1F5C63);color:#fff;font-weight:500;font-size:11.5px;padding:7px 8px;text-align:left}
table.t td{padding:8px;border-bottom:1px solid var(--rule);vertical-align:top}
table.t .r{text-align:right}
table.t .c{text-align:center}
table.t .sub{display:block;font-size:11px;color:var(--ink-2)}
table.t .mono{font-family:var(--mono);font-size:11.5px}
table.t tfoot td{border-bottom:0;font-weight:700}
.pn{display:flex;gap:10px;align-items:flex-start}
.pimg{width:48px;height:48px;display:flex;align-items:center;justify-content:center;border:1px solid var(--rule);border-radius:4px;background:#fff;flex:0 0 auto;overflow:hidden}
.split{display:grid;grid-template-columns:1.25fr 1fr;gap:22px;align-items:start}
.notes{font-size:11.5px;line-height:1.75}
.notes .cap{font-weight:700;margin-top:6px}
.notes .cap:first-child{margin-top:0}
.sum{display:flex;flex-direction:column;gap:4px;font-variant-numeric:tabular-nums}
.sum div{display:flex;justify-content:space-between;gap:12px}
.sum span{color:var(--ink-2)}
.sum .tot{border-top:1.5px solid var(--ink);padding-top:6px;margin-top:4px;font-size:15px;font-weight:700}
.sum .tot b{color:var(--brand,#1F5C63);font-family:var(--mono);font-weight:500;font-size:17px}
.sum .cn{font-size:11px;color:var(--ink-2);text-align:right;display:block}
.strip{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.strip div{padding:10px 12px;border-right:1px solid var(--rule)}
.strip div:last-child{border-right:0;background:var(--tint)}
.strip span{display:block;font-size:11px;color:var(--ink-2)}
.strip b{font-family:var(--mono);font-weight:500;font-size:15px}
.strip div:last-child b{color:var(--brand,#1F5C63);font-size:17px}
.signs{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.sign{border:1px solid var(--rule);border-radius:6px;padding:12px 14px;min-height:120px;position:relative}
.sign .cap{font-weight:700;margin-bottom:6px}
.sign .ln{margin-top:34px;border-top:1px solid var(--ink-2);padding-top:4px;font-size:11px;color:var(--ink-2)}
.seals{display:flex;align-items:flex-end;gap:10px;margin-top:6px}
.seals .co{width:96px;height:96px}
.seals .p{width:62px;height:62px}
.fine{font-size:10.5px;color:var(--ink-2);line-height:1.7}
/* contract */
.ct-title{text-align:center;font-family:var(--serif);font-weight:900;font-size:24px;letter-spacing:.12em;padding-bottom:6px}
.ct-meta{text-align:center;font-size:11px;color:var(--ink-2);margin-top:-12px;padding-bottom:12px;border-bottom:1px solid var(--rule)}
.ct-meta b{font-family:var(--mono);font-weight:500}
.ct-intro{font-size:12.5px;line-height:1.85}
.clause .h{font-weight:700;margin-bottom:2px}
.clause .h em{font-style:normal;color:var(--brand,#1F5C63);margin-right:6px}
.clause p{margin:0;text-align:justify;line-height:1.85;white-space:pre-wrap}
.blank{color:var(--ink-2)}
.sig-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;padding-top:14px;border-top:1px solid var(--ink)}
.sig .cap{font-weight:700;color:var(--brand,#1F5C63);margin-bottom:6px}
.sig div{font-size:12px;line-height:1.85;overflow-wrap:anywhere}
.sig .stamp{width:96px;height:96px;border:1px dashed var(--rule);border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--ink-2);font-size:11px;margin-top:6px}
.roc{text-align:center;font-family:var(--serif);font-weight:600;letter-spacing:.5em;font-size:14px;padding-top:10px}
.ph{color:#9AA19F}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <header class="bar">
    <div class="brand"><h1>奇異單據工坊</h1><select id="coSwitch" class="co-switch" aria-label="切換公司行號"></select></div>
    <button class="btn" id="btnProducts" type="button">產品庫</button>
    <button class="btn" id="btnCompany" type="button">公司與印章設定</button>
    <button class="btn btn-ghost" id="btnBackup" type="button">備份</button>
  </header>
  <div class="main" id="main" data-view="form">
    <nav class="shelf" id="shelf" role="tablist" aria-label="文件種類"></nav>
    <div class="seg" id="seg"><button type="button" data-v="form" aria-pressed="true">填寫</button><button type="button" data-v="preview" aria-pressed="false">預覽</button></div>
    <section class="form-panel" id="formPanel" aria-label="填寫欄位"></section>
    <section class="preview-panel" aria-label="A4 預覽">
      <div class="pv-head">
        <span class="lbl" id="pvLabel">A4 即時預覽</span>
        <button class="btn" id="btnDownload" type="button">下載 PDF</button>
        <button class="btn btn-primary" id="btnSave" type="button">存到雲端硬碟</button>
        <div class="status info" id="status" role="status" aria-live="polite" hidden></div>
      </div>
      <div class="fit" id="fit"><div class="fit-box" id="fitBox"><div class="paper" id="paper"></div></div></div>
    </section>
  </div>
</div>
<div id="capture" aria-hidden="true"></div>
<div class="modal" id="modal" hidden></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
/* ===== 獨立網站版：取代 claude.ai 專屬功能 ===== */
window.STANDALONE = true;
window.GAS_URL = "https://script.google.com/macros/s/AKfycby8UQBlwIItBdop7mudXmN6eBOH7iYeNn9rrmiJ8WOK7dPfVt7lkig0Qs0PuR7e_VXklg/exec";
(function(){
  const PWK="chiyi-docs-pw";
  const getPw=()=>{ try{ return localStorage.getItem(PWK)||""; }catch(e){ return ""; } };
  async function gas(payload){
    if(!window.GAS_URL) throw {code:"not_configured",message:"雲端存檔尚未設定"};
    let res;
    try{ res=await fetch(window.GAS_URL,{method:"POST",body:JSON.stringify(Object.assign({password:getPw()},payload))}); }
    catch(e){ throw {code:"server_unavailable",message:"連不到雲端存檔服務"}; }
    let j; try{ j=await res.json(); }catch(e){ throw {code:"upstream_error",message:"雲端存檔服務回傳格式錯誤"}; }
    if(!j.ok) throw {code:j.error==="wrong_password"?"wrong_password":"tool_error",message:j.error||"未知錯誤"};
    return j;
  }
  window.__gas=gas;
  const downloads={ save: async ({filename,data})=>{
    const blob = data instanceof Blob ? data : new Blob([data],{type:"application/octet-stream"});
    const url=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=url; a.download=filename;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000); return {status:"saved"}; } };
  const mcp={
    listTools: async()=>({servers:[],fileArgs:false}),
    callTool: async(server,tool,input)=>{
      if(input.contentMimeType==="application/vnd.google-apps.folder"){ const j=await gas({action:"folder",title:input.title,parentId:input.parentId||""}); return {payload:{id:j.id,viewUrl:j.url}}; }
      if(input.contentMimeType==="text/html"){ const j=await gas({action:"gdoc",title:input.title,html:input.textContent,parentId:input.parentId||""}); return {payload:{id:j.id,viewUrl:j.url}}; }
      const j=await gas({action:"upload",title:input.title,mime:input.contentMimeType,base64:input.base64Content,parentId:input.parentId||""}); return {payload:{id:j.id,viewUrl:j.url}};
    }
  };
  window.claude={ use: async n => n==="downloads" ? downloads : n==="mcp" ? mcp : null };
  /* password gate (only when cloud saving is configured) */
  window.addEventListener("DOMContentLoaded",()=>{
    if(!window.GAS_URL) return;
    const ov=document.createElement("div"); ov.id="pwGate";
    ov.innerHTML=`<form class="pw-box"><h2>奇異單據工坊</h2><p>請輸入公司共用密碼</p><input id="pwIn" type="password" autocomplete="current-password" aria-label="密碼" required><button class="btn btn-primary" type="submit">進入</button><span id="pwMsg" class="hint"></span></form>`;
    document.body.appendChild(ov);
    const done=()=>ov.remove();
    const tryPw=async(pw,silent)=>{ try{ localStorage.setItem(PWK,pw); }catch(e){}
      try{ await gas({action:"check"}); done(); }catch(err){ if(!silent) document.getElementById("pwMsg").textContent = err.code==="wrong_password"?"密碼不正確，請再試一次。":"暫時連不到伺服器，請稍後再試。"; try{ localStorage.removeItem(PWK);}catch(e){} } };
    if(getPw()) tryPw(getPw(),true);
    ov.querySelector("form").addEventListener("submit",e=>{ e.preventDefault(); document.getElementById("pwMsg").textContent="確認中…"; tryPw(document.getElementById("pwIn").value,false); });
  });
})();
</script>
<style>
#pwGate{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
#pwGate .pw-box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px;display:flex;flex-direction:column;gap:12px;width:min(360px,100%)}
#pwGate h2{margin:0;font-family:var(--serif);font-weight:900}
#pwGate p{margin:0;color:var(--muted)}
#pwGate input{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface-2)}
</style>

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const addDays = (iso,n) => { const d = new Date(iso+"T00:00:00"); d.setDate(d.getDate()+n); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };

function cnNum(n){ const d="零一二三四五六七八九"; if(n<10) return d[n]; if(n===10) return "十"; if(n<20) return "十"+d[n-10]; const t=Math.floor(n/10), o=n%10; return d[t]+"十"+(o?d[o]:""); }
function cnAmount(n){
  n = Math.round(num(n)); if(n<=0) return "零元整";
  const D="零壹貳參肆伍陸柒捌玖", U=["","拾","佰","仟"], B=["","萬","億","兆"];
  const four = g => { let s="", z=false; for(let p=3;p>=0;p--){ const k=Math.floor(g/Math.pow(10,p))%10; if(k===0){ if(s) z=true; } else { if(z){ s+="零"; z=false; } s+=D[k]+U[p]; } } return s; };
  const groups=[]; while(n>0){ groups.push(n%10000); n=Math.floor(n/10000); }
  let r="", zp=false;
  for(let i=groups.length-1;i>=0;i--){ const g=groups[i]; if(g===0){ if(r) zp=true; continue; } if(r && (g<1000 || zp)) r+="零"; zp=false; r+=four(g)+B[i]; }

const IMG_CACHE={};
let ratioT;
function imgRatio(src){ if(!src) return 0; let im=IMG_CACHE[src]; if(!im){ im=new Image(); im.onload=()=>{ clearTimeout(ratioT); ratioT=setTimeout(()=>{ try{ render(); }catch(e){} },60); }; im.src=src; IMG_CACHE[src]=im; } return im.naturalWidth ? im.naturalWidth/im.naturalHeight : 0; }
/* fit an image inside a w×h box keeping its proportions; returns img tag */
function fitImg(src, bw, bh, cls){ if(!src) return ""; const r=imgRatio(src); let w=bw,h=bh; if(r){ if(r>=bw/bh){ w=bw; h=Math.round(bw/r); } else { h=bh; w=Math.round(bh*r); } return `<img ${cls?`class="${cls}"`:""} src="${src}" width="${w}" height="${h}" style="width:${w}px;height:${h}px" alt="">`; } return `<img ${cls?`class="${cls}"`:""} src="${src}" style="max-width:${bw}px;max-height:${bh}px;width:auto;height:auto" alt="">`; }
function cnFormal(n){ const d="零壹貳參肆伍陸柒捌玖"; if(n<10) return d[n]; if(n===10) return "拾"; if(n<20) return "拾"+d[n-10]; return d[Math.floor(n/10)]+"拾"+(n%10?d[n%10]:""); }

const prodById = id => (S.products||[]).find(p=>p.id===id);
const lines = t => String(t||"").split("\n").map(x=>x.trim()).filter(Boolean);
function prodDetailHTML(d, gd){
  const ids=[...new Set(d.items.map(it=>it.pid).filter(id=>id && prodById(id)))];
  if(!ids.length || d.showDetail===false) return "";
  const B=S.company.color||"#1F5C63", fs=gd?"10pt":"12px";
  const bd="border:1px solid #9AA3A1;";
  const td=(c,st)=>`<td style="${bd}padding:${gd?"4px 6px":"7px 9px"};font-size:${fs};line-height:1.6;vertical-align:middle;${st||""}">${c}</td>`;
  const th=c=>`<td style="border:1px solid ${B};background-color:${B};color:#ffffff;padding:${gd?"4px 6px":"6px 9px"};font-size:${fs};font-weight:bold;text-align:center">${c}</td>`;
  const img=(src,w)=>{ const s=photoSrc(src); if(!s) return ""; const r=imgRatio(s), h=r?Math.round(w/r):""; return `<img src="${s}" width="${w}" ${h?`height="${h}"`:""} style="width:${w}px;${h?`height:${h}px`:""};max-width:100%">`; };
  const rows=ids.map(id=>{ const p=prodById(id);
    const sp=lines(p.specs).map(l=>l.split(/[：:]/));
    const spT=sp.length?`<table style="width:100%;border-collapse:collapse;margin-top:6px">${sp.map(([k,...v])=>`<tr><td style="border:1px solid #C9CFCD;padding:2px 6px;font-size:${gd?"9pt":"11px"};width:38%;background-color:#F3F6F5">${esc(k)}</td><td style="border:1px solid #C9CFCD;padding:2px 6px;font-size:${gd?"9pt":"11px"}">${esc(v.join(":"))}</td></tr>`).join("")}</table>`:"";
    return `<tr class="blk">${td(`<b>${esc(p.name)}</b>${p.spec?`<br><span style="color:#555555;font-size:${gd?"9pt":"11px"}">(${esc(p.spec)})</span>`:""}`,"width:24%;text-align:center")}${td(`${img(p.img,gd?150:170)}${p.img2?`<br>${img(p.img2,gd?110:130)}`:""}${spT}`,"width:36%;text-align:center")}${td(lines(p.acc).map(a=>`・${esc(a)}`).join("<br>"),"width:40%")}</tr>`; }).join("");
  return `<p class="blk" style="margin:${gd?"10px":"6px"} 0 4px 0;font-size:${gd?"11pt":"13px"};font-weight:bold;color:${B}">附件：產品規格明細</p><table class="blk" style="width:100%;border-collapse:collapse;table-layout:fixed"><tr>${th("品名")}${th("圖示")}${th("配件")}</tr>${rows}</table>`;
}
function openProducts(){
  const P=S.products;
  const card=(p,i)=>`<div class="item"><div class="item-h"><span>${esc(p.name||"新產品")}</span><button class="x" type="button" title="刪除" aria-label="刪除產品" data-delprod="${i}">×</button></div>
    <div class="grid2">
      <div class="fld full"><span class="flbl">產品照片</span><div class="imgf">${p.img?`<img src="${photoSrc(p.img)}" alt="">`:`<span class="noimg">無圖片</span>`}<label class="btn btn-sm" for="pimg${i}">${p.img?"更換":"上傳"}</label><input id="pimg${i}" type="file" accept="image/*" data-pimg="${i}.img" hidden>
        ${p.img2?`<img src="${photoSrc(p.img2)}" alt="">`:""}<label class="btn btn-sm" for="pimg2${i}">${p.img2?"更換第二張":"加第二張"}</label><input id="pimg2${i}" type="file" accept="image/*" data-pimg="${i}.img2" hidden>${p.img2?`<button class="btn btn-sm btn-ghost" type="button" data-clrimg2="${i}">移除第二張</button>`:""}</div></div>
      ${fieldHTML(F("name","品名","text",{full:1}),`products.${i}.name`,p.name)}
      ${fieldHTML(F("spec","規格／保固（顯示在品名下）","text",{full:1}),`products.${i}.spec`,p.spec)}
      ${fieldHTML(F("unit","單位"),`products.${i}.unit`,p.unit)}
      ${fieldHTML(F("price","預設單價（未稅）","num"),`products.${i}.price`,p.price)}
      ${fieldHTML(F("acc","配件（一行一項）","area",{full:1}),`products.${i}.acc`,p.acc)}
      ${fieldHTML(F("specs","規格表（一行一項，例：電壓：AC110V）","area",{full:1}),`products.${i}.specs`,p.specs)}

const PL = PL_DATA.items, PL_IMG = PL_DATA.imgs;
const PL_SERIES = [...new Set(PL.map(x=>x.s))];
let PLSEL = {}, PLSER = "全部", PLQ = "";
const plUnit = u => /^(支|盒|組|瓶|罐|包|條)/.test(u) ? u.replace(/\(.*\)/,"") : (/粒/.test(u) ? "盒" : /ml|ML|g|G|L/.test(u) ? "瓶" : (u||"組"));
function plListHTML(){
  const q=PLQ.trim().toLowerCase();
  const rows=PL.map((x,i)=>({...x,k:i})).filter(x=>(PLSER==="全部"||x.s===PLSER) && (!q || (x.n+x.c+x.s).toLowerCase().includes(q)));
  if(!rows.length) return `<div class="empty">找不到符合的產品。</div>`;
  let h="", lastS="", lastN="";
  rows.forEach(x=>{
    if(x.s!==lastS){ if(lastS) h+=`</div>`; h+=`<div class="pl-ser"><div class="pl-sh">${esc(x.s)}</div>`; lastS=x.s; lastN=""; }
    if(x.n!==lastN){ h+=`<div class="pl-name">${x.i>=0?`<img src="${PL_IMG[x.i]}" alt="">`:""}<b>${esc(x.n)}</b></div>`; lastN=x.n; }
    const on=PLSEL[x.k]!==undefined;
    h+=`<label class="pl-row${on?" on":""}"><input type="checkbox" data-plc="${x.k}" ${on?"checked":""}><span class="pl-u">${esc(x.u)}</span><span class="pl-c">${esc(x.c)}</span><span class="pl-p">NT$ ${money(x.p)}</span><input class="pl-q" type="number" min="1" inputmode="numeric" data-plq="${x.k}" value="${on?PLSEL[x.k]:1}" aria-label="數量" ${on?"":"disabled"}></label>`;
  });
  return h+`</div>`;
}
function plSummary(){
  const ks=Object.keys(PLSEL); const disc=num($("#plDisc")&&$("#plDisc").value);
  const f=disc>0&&disc<10?disc/10:1;
  const tot=ks.reduce((a,k)=>a+Math.round(PL[k].p*f)*num(PLSEL[k]),0);
  const s=$("#plSum"); if(s) s.textContent = ks.length?`已選 ${ks.length} 項・合計 NT$ ${money(tot)}${f<1?`（${disc} 折後）`:""}`:"還沒有勾選產品";
  const b=$("#plAdd"); if(b){ b.disabled=!ks.length; b.textContent=ks.length?`加入${DOCS[S.cur].label}（${ks.length} 項）`:"加入"; }
}
function openPriceList(){
  PLSEL={}; PLQ="";
  $("#modal").innerHTML=`<div class="sheet pl-sheet" role="dialog" aria-modal="true" aria-labelledby="plTitle"><div class="sheet-h"><h3 id="plTitle">從產品售價表勾選</h3><button class="x" type="button" data-close aria-label="關閉">×</button></div>
   <div class="sheet-b">
    <div class="pl-tools"><input id="plSearch" type="search" placeholder="搜尋品名或產品編號" aria-label="搜尋產品"><label class="pl-disc">折數 <input id="plDisc" type="number" step="0.5" min="0" max="10" placeholder="原價" aria-label="折數，例如 8 表示 8 折"> 折</label></div>
    <div class="pl-chips">${["全部",...PL_SERIES].map(s=>`<button type="button" class="chip${s===PLSER?" on":""}" data-plser="${esc(s)}">${esc(s)}</button>`).join("")}</div>
    <div id="plList" class="pl-list">${plListHTML()}</div>
   </div>
   <div class="sheet-f pl-foot"><span id="plSum" class="hint"></span><label class="chk" style="grid-column:auto;margin-left:auto"><input type="checkbox" id="plReplace"> 取代現有品項</label><button class="btn btn-primary" type="button" id="plAdd">加入</button></div></div>`;
  $("#modal").hidden=false; plSummary(); $("#plSearch").focus();
  $("#plSearch").addEventListener("input",e=>{ PLQ=e.target.value; $("#plList").innerHTML=plListHTML(); });
  $("#plDisc").addEventListener("input",plSummary);
  $("#modal .pl-chips").addEventListener("click",e=>{ const b=e.target.closest("[data-plser]"); if(!b) return; PLSER=b.dataset.plser; [...e.currentTarget.children].forEach(c=>c.classList.toggle("on",c===b)); $("#plList").innerHTML=plListHTML(); });
  $("#plList").addEventListener("change",e=>{ const c=e.target.dataset.plc; if(c!==undefined){ if(e.target.checked) PLSEL[c]=1; else delete PLSEL[c]; const row=e.target.closest(".pl-row"); row.classList.toggle("on",e.target.checked); const q=row.querySelector(".pl-q"); q.disabled=!e.target.checked; if(e.target.checked){ q.value=1; } plSummary(); } });
  $("#plList").addEventListener("input",e=>{ const k=e.target.dataset.plq; if(k!==undefined && PLSEL[k]!==undefined){ PLSEL[k]=Math.max(1,num(e.target.value)||1); plSummary(); } });
  $("#plAdd").addEventListener("click",()=>{
    const type=S.cur, d=S.docs[type]; const disc=num($("#plDisc").value); const f=disc>0&&disc<10?disc/10:1;
    const add=Object.keys(PLSEL).map(k=>{ const x=PL[k]; const price=x.p;
      const spec=`${x.u}｜${x.c}`;
      return type==="ship" ? {name:x.n,spec:`${x.u}｜${x.c}`,lot:"",exp:"",qty:num(PLSEL[k]),unit:plUnit(x.u),price,img:`L:${x.i}`}
                           : {name:x.n,spec,unit:plUnit(x.u),qty:num(PLSEL[k]),price,disc:f<1?Math.round(f*100):"",img:`L:${x.i}`}; });
    const empty=d.items.length===1 && !d.items[0].name;
    d.items = ($("#plReplace").checked||empty) ? add : d.items.concat(add);
    d.sample=false; persist(); $("#modal").hidden=true; $("#modal").innerHTML=""; renderForm(); render();

function personalText(owner){ const c=[...String(owner||"").trim()]; if(!c.length) return ""; if(c.length===1) return c[0]+"印"; if(c.length===2) return c.join("")+"之印"; if(c.length===3) return c.join("")+"印"; return c.slice(0,4).join(""); }
function rng(seed){ let h=2166136261; for(const ch of seed){ h^=ch.charCodeAt(0); h=Math.imul(h,16777619);} return ()=>{ h^=h<<13; h^=h>>>17; h^=h<<5; return ((h>>>0)%10000)/10000; }; }
async function drawSeal(text, kind){
  const chars=[...String(text||"").replace(/\s/g,"")]; if(!chars.length) return "";
  try{ await document.fonts.load('900 64px "Noto Serif TC"', chars.join("")); }catch(e){}
  const S2=320, c=document.createElement("canvas"); c.width=c.height=S2; const x=c.getContext("2d");
  const red="#C8322B"; x.strokeStyle=red; x.fillStyle=red; x.textAlign="center"; x.textBaseline="middle";
  let cols, padIn;
  if(kind==="co"){ x.lineWidth=20; x.strokeRect(12,12,S2-24,S2-24); padIn=40; const n=chars.length; cols = n<=3?1 : n<=8?2 : n<=12?3 : 4; }
  else { x.lineWidth=16; x.beginPath(); x.arc(S2/2,S2/2,S2/2-12,0,Math.PI*2); x.stroke(); padIn=66; cols = chars.length<=2?1:2; }
  const n=chars.length, base=Math.floor(n/cols), extra=n%cols, W=S2-2*padIn, colW=W/cols; let idx=0;
  for(let ci=0; ci<cols; ci++){
    const cnt=base+(ci<extra?1:0), cx=S2-padIn-colW*(ci+0.5), cellH=(S2-2*padIn)/cnt, fs=colW*0.94;
    for(let r=0;r<cnt;r++){ const ch=chars[idx++]; const cy=padIn+cellH*(r+0.5); x.save(); x.translate(cx,cy); x.scale(1, Math.max(0.55, Math.min(cellH/fs, 2.4))); x.font=`900 ${fs}px "Noto Serif TC", serif`; x.fillText(ch,0,fs*0.03); x.restore(); }
  }
  const R=rng(text+kind); x.globalCompositeOperation="destination-out";
  for(let i=0;i<70;i++){ x.globalAlpha=0.25+R()*0.5; x.beginPath(); x.arc(R()*S2,R()*S2,1+R()*4,0,Math.PI*2); x.fill(); }
  return c.toDataURL("image/png");
}

function fieldHTML(f, path, val){
  const id = "f_"+path.replace(/\./g,"_");
  const full = f.full ? " full" : "";
  if(f.t==="img") return `<div class="fld full"><span class="flbl">${esc(f.l)}</span><div class="imgf">${val?`<img src="${photoSrc(val)}" alt="圖片">`:`<span class="noimg">無圖片</span>`}<label class="btn btn-sm" for="${id}">${val?"更換圖片":"上傳圖片"}</label><input id="${id}" type="file" accept="image/*" data-imgpath="${path}" hidden>${val?`<button class="btn btn-sm btn-ghost" type="button" data-act="delimg" data-p="${path}">移除</button>`:""}</div></div>`;
  if(f.t==="chk") return `<label class="chk"><input type="checkbox" id="${id}" data-path="${path}" ${val?"checked":""}> ${esc(f.l)}</label>`;
  let ctl;
  if(f.t==="sel") ctl = `<select id="${id}" data-path="${path}">${f.o.map(o=>`<option ${o===val?"selected":""}>${esc(o)}</option>`).join("")}</select>`;
  else if(f.t==="area") ctl = `<textarea id="${id}" data-path="${path}">${esc(val)}</textarea>`;
  else { const type = f.t==="num"?"number":f.t==="date"?"date":f.t==="month"?"month":"text"; ctl = `<input id="${id}" type="${type}" data-path="${path}" ${f.t==="num"?'inputmode="decimal" data-num="1"':""} value="${esc(val)}">`; }
  return `<div class="fld${full}"><label for="${id}">${esc(f.l)}</label>${ctl}</div>`;
}

/* ---------- calculations ---------- */
const discPct = it => { const v=num(it.disc); return v>0 && v<100 ? v : 100; };
const lineAmt = it => Math.round(num(it.qty)*num(it.price)*discPct(it)/100);
const discTxt = it => discPct(it)<100 ? discPct(it)+"%" : "—";
function quoteCalc(d){
  const gross = d.items.reduce((a,i)=>a+lineAmt(i),0);
  const sub = Math.max(0, gross - num(d.discount));
  if(d.taxMode.startsWith("外加")){ const tax=Math.round(sub*0.05); return {gross,sub,tax,total:sub+tax,pre:sub}; }
  if(d.taxMode.startsWith("內含")){ const tax=Math.round(sub-sub/1.05); return {gross,sub,tax,total:sub,pre:sub-tax}; }
  return {gross,sub,tax:0,total:sub,pre:sub};
}
const THRESH = 20000;
function kolCalc(d){
  const fee=Math.round(num(d.fee));
  if(d.feeType.startsWith("公司")) return {fee,company:true,wh:0,nhi:0,net:fee};
  const wh = fee>THRESH ? Math.round(fee*0.10) : 0;
  const nhi = (!d.union && fee>=THRESH) ? Math.round(fee*0.0211) : 0;
  return {fee,company:false,wh,nhi,net:fee-wh-nhi};
}
function updateCalc(){
  const el=$("#calc"); if(!el) return;
  const k=kolCalc(S.docs.kol);
  el.innerHTML = k.company ? `公司行號請款：乙方開立統一發票，甲方全額匯款 <b>NT$ ${money(k.fee)}</b>`
   : `代扣所得稅 10%：<b>− ${money(k.wh)}</b>　二代健保 2.11%：<b>− ${money(k.nhi)}</b><br>實際匯款：<b>NT$ ${money(k.net)}</b><br><span style="color:var(--muted)">單次給付超過 NT$20,000 才扣稅、達 NT$20,000 才扣二代健保，請以國稅局及健保署最新規定為準。</span>`;
}

function shrinkImage(file, max){
  return new Promise((res,rej)=>{ const url=URL.createObjectURL(file); const im=new Image();
    im.onload=()=>{ const s=Math.min(1, max/Math.max(im.width,im.height)); const c=document.createElement("canvas"); c.width=Math.round(im.width*s); c.height=Math.round(im.height*s);
      const g=c.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,c.width,c.height); g.drawImage(im,0,0,c.width,c.height); URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg",0.85)); };
    im.onerror=()=>{ URL.revokeObjectURL(url); rej(); }; im.src=url; });
}
async function handleImg(path, file){
  try{ const data=await shrinkImage(file, 300); setPath(S.docs[S.cur], path, data); persist(); renderForm(); render(); }

}

      +T(`<tr>${td(A,"width:50%;border-top:1.5pt solid #1E1E1E")}${td(Bp,"width:50%;border-top:1.5pt solid #1E1E1E")}</tr>`)+gap
      +P(`<b>${rocDate(d.date)}</b>`,"text-align:center;font-size:12pt;letter-spacing:4pt");
  }
  return `<html><head><meta charset="utf-8"><style>@page{size:A4;margin:14mm 15mm}</style></head><body style="${FONT}font-size:9.5pt;color:#1E1E1E">${body}</body></html>`;
}
function explain(err){
  const c=err && err.code;
  try{ console.error("[單據工坊] 存檔失敗", err); }catch(e){}
  return explainBase(err) + `<br><span style="opacity:.75;font-size:12px">錯誤代碼：${esc(c||"none")}${err&&err.message&&c!=="lib"?"／"+esc(String(err.message).slice(0,160)):""}</span>`;
}
function explainBase(err){
  const c=err && err.code;
  if(c==="lib") return err.message;
  if(c==="wrong_password") return "密碼錯誤或已變更，請重新整理頁面後再輸入密碼。";
  if(c==="not_configured") return "雲端存檔還沒設定完成，請先用「下載 PDF」。";
  if(c==="too_large") return "這份文件內容太多，壓縮後還是超過雲端上傳上限。請先用「下載 PDF」，或減少附件照片後再存。";
  if(c==="needs_reauth") return "Google 雲端硬碟的連線過期了。請到 claude.ai「設定 → 連接器」重新連結 Google Drive，再按一次存檔。";
  if(c==="server_not_connected"||c==="selection_required") return "這個帳號還沒連上 Google Drive。請到 claude.ai「設定 → 連接器」加入 Google Drive，再按一次存檔。";
  if(c==="not_in_manifest"||c==="approval_required"||c==="consent_required") return "這個頁面需要你允許使用 Google Drive 才能存檔。請再按一次「存到雲端硬碟」，在跳出的視窗按允許。";
  if(c==="blocked_by_policy") return "你的組織政策不允許這個頁面寫入 Google Drive。可以先用「下載 PDF」。";
  if(c==="server_unavailable"||c==="upstream_error"||c==="cancelled") return "雲端硬碟沒有及時回應，檔案可能已經建立。請先打開資料夾確認，沒有的話再按一次。";
  if(c==="tool_error") return "雲端硬碟拒絕了這次存檔："+esc(err.message||"")+"。如果是找不到資料夾，請到「公司與印章設定」按「重新建立雲端資料夾」。";
  if(c==="not_granted"||c==="capability_disabled"||c==="capability_removed") return "在這個畫面無法連到雲端硬碟。請在 claude.ai 裡打開這個頁面再存檔，或先用「下載 PDF」。";
  return "存檔沒有成功（"+esc(c||err&&err.message||"未知原因")+"）。可以再試一次，或先用「下載 PDF」。";
}

async function makeFolders(mcp,C){
  const mk = async (title,parent)=>{ const inp={title,contentMimeType:"application/vnd.google-apps.folder"}; if(parent) inp.parentId=parent; const r=await mcp.callTool(DRIVE,"create_file",inp); const id=(r.payload||{}).id; if(!id) throw {code:"tool_error",message:"沒有拿到資料夾編號"}; return id; };
  const rootName=`${(C.name||"公司").replace(/[\\/:*?"<>|]/g,"-")}_行政單據`;
  let base = C.folders && C.folders.root ? Object.assign({},C.folders) : null;
  if(!base && C.id==="chiyi"){ base={root:ROOT_FOLDER,rootName:"奇異生技_行政單據"}; for(const [k,m] of Object.entries(DOCS)) if(m.folder) base[k]=m.folder; }
  const f = base || {root:await mk(rootName), rootName};
  for(const [k,m] of Object.entries(DOCS)){ if(!f[k]) f[k]=await mk(m.label.replace(/\s/g,""),f.root); }
  C.folders=f; persist(); renderShelf();
}
let busy=false;
async function saveDrive(){
  if(busy) return; busy=true; const btn=$("#btnSave"); btn.disabled=true;
  const type=S.cur, title=docTitle(), C=S.company; let folder=folderOf(C,type);
  let pdfUrl="", docUrl="";
  try{
    setStatus("info","正在產生 PDF…");
    const mcp = window.claude && window.claude.use ? await window.claude.use("mcp") : null;
    if(!mcp) throw {code:"not_granted"};
    if(!folder){ setStatus("info",`第一次幫「${esc(C.name)}」存檔，正在雲端硬碟建立資料夾…`); await makeFolders(mcp,C); folder=folderOf(C,type); }
    setStatus("info","正在產生 PDF…");
    const {blob, html} = await buildPDF();
    let fileArgs=false; try{ fileArgs = (await mcp.listTools()).fileArgs===true; }catch(e){}
    setStatus("info","正在上傳 PDF 到雲端硬碟…");
    const pdfInput = c => ({title:title+".pdf",parentId:folder,contentMimeType:"application/pdf",disableConversionToGoogleType:true,base64Content:c});
    let r1;
    if(fileArgs){
      try{ r1 = await mcp.callTool(DRIVE,"create_file",pdfInput({$file:{data:blob,name:"document.pdf",type:"application/pdf"}})); }
      catch(e){ if(e && (e.code==="bad_request"||e.code==="capability_disabled"||e.code==="transform_error")) r1=null; else throw e; }
    }
    if(!r1){
      /* inline upload is capped near 1 MB: shrink the PDF until it fits */
      const LIMIT=window.STANDALONE?30000000:900000; let b64=await blobB64(blob);
      for(const o of [{scale:1.6,q:0.72},{scale:1.35,q:0.62},{scale:1.15,q:0.55},{scale:1,q:0.5}]){
        if(b64.length<=LIMIT) break;
        setStatus("info","檔案較大，正在壓縮 PDF 後再上傳…");
        b64=await blobB64((await buildPDF(o)).blob);
      }
      if(b64.length>LIMIT) throw {code:"too_large",message:"PDF 壓縮後仍超過上傳上限"};
      setStatus("info","正在上傳 PDF 到雲端硬碟…");
      r1 = await mcp.callTool(DRIVE,"create_file",pdfInput(b64));
    }
    const p1=r1.payload||{}; pdfUrl=p1.viewUrl||(p1.id?`https://drive.google.com/file/d/${p1.id}/view`:"");
    setStatus("info","PDF 已存好，正在建立 Google 文件…");
    const r2 = await mcp.callTool(DRIVE,"create_file",{title:title,parentId:folder,contentMimeType:"text/html",textContent:gdocHTML(type)});
    const p2=r2.payload||{}; docUrl=p2.viewUrl||(p2.id?`https://docs.google.com/document/d/${p2.id}/edit`:"");
    const d=new Date();
    S.history.unshift({title,label:`${C.name}・${DOCS[type].label}`,at:`${today()} ${pad(d.getHours())}:${pad(d.getMinutes())}`,pdf:pdfUrl,gdoc:docUrl});
    S.history=S.history.slice(0,60); persist(); renderShelf();
    setStatus("ok",`已存到「${DOCS[type].label}」資料夾：${pdfUrl?`<a href="${esc(pdfUrl)}" target="_blank" rel="noopener">開啟 PDF</a>`:"PDF"}　${docUrl?`<a href="${esc(docUrl)}" target="_blank" rel="noopener">開啟 Google 文件</a>`:""}`);
  }catch(err){
    const pre = pdfUrl ? `PDF 已存好（<a href="${esc(pdfUrl)}" target="_blank" rel="noopener">開啟</a>），但 Google 文件沒有建立。` : "";
    setStatus("err", pre + explain(err));
  }finally{ busy=false; btn.disabled=false; }
}
async function downloadPDF(){
  if(busy) return; busy=true; const btn=$("#btnDownload"); btn.disabled=true;
  try{
    setStatus("info","正在產生 PDF…");
    const dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
    if(!dl){ setStatus("err","這個畫面不能下載檔案，請改用「存到雲端硬碟」。"); return; }
    const {blob}=await buildPDF();
    await dl.save({filename:docTitle()+".pdf",data:blob});
    setStatus("ok","PDF 已交給瀏覽器下載。");
  }catch(err){
    if(err&&err.code==="declined") setStatus("info","已取消下載。");
    else if(err&&err.code==="lib") setStatus("err",err.message);
    else setStatus("err","下載沒有成功（"+esc(err&&(err.code||err.message)||"未知原因")+"）。可以改用「存到雲端硬碟」。");
  }finally{ busy=false; btn.disabled=false; }
}
$("#btnSave").addEventListener("click",saveDrive);
$("#btnDownload").addEventListener("click",downloadPDF);

  <div class="sheet-b"><div class="hint">這些資料會自動帶入 5 種文件，只存在這台裝置的瀏覽器；換電腦時請用「備份」匯出再匯入。</div>
   <div class="grid2" id="coForm">${CO_FIELDS.map(f=>fieldHTML(f,"company."+f.k,C[f.k])).join("")}

   <div class="seal-row"><img id="pvP" alt="負責人章預覽" src="${SEAL.p||""}"><div class="fld"><label for="sealP">負責人章文字（填了才會自動產生印章，空白＝不蓋）</label><input id="sealP" data-path="company.sealP" value="${esc(C.sealP)}" placeholder="例：${esc(personalText(C.owner)||"王大明印")}"><input type="file" accept="image/png" data-img="sealPImg" aria-label="上傳負責人章 PNG"></div></div>
   <div class="hint">上傳透明背景 PNG 會取代自動產生的印章。<button class="btn btn-sm btn-ghost" type="button" data-clearimg>移除上傳的圖片</button></div>
   <details><summary>雲端資料夾</summary><div class="hint" style="margin-top:8px">${rootOf(C)?`目前存到：<a href="https://drive.google.com/drive/folders/${esc(rootOf(C))}" target="_blank" rel="noopener" style="color:var(--accent)">${esc(C.folders.rootName||(C.id==="chiyi"?"奇異生技_行政單據":C.name+"_行政單據"))}</a>。`:"這家公司還沒有雲端資料夾，第一次存檔時會自動建立。"}如果資料夾被刪除或想換一組，按下面的按鈕會在雲端硬碟根目錄建立新的一組。</div>
    <button class="btn btn-sm" type="button" id="btnFolders" style="margin-top:8px">重新建立雲端資料夾</button> <span class="hint" id="folderMsg"></span></details>
  </div><div class="sheet-f">${S.companies.length>1?`<button class="btn btn-ghost" type="button" data-delco style="margin-right:auto">刪除這家公司</button>`:""}<button class="btn btn-primary" type="button" data-close>完成</button></div></div>`;
  $("#modal").hidden=false; $("#modal").querySelector("input").focus();
}
let sealT;
$("#modal").addEventListener("input",e=>{
  const p=e.target.dataset.path; if(!p) return;
  setPath(S, p, e.target.value); persist(); if(p==="company.name") { renderCoSwitch(); renderShelf(); }
  clearTimeout(sealT); sealT=setTimeout(async()=>{ await refreshSeals(); const a=$("#pvCo"), b=$("#pvP"); if(a) a.src=SEAL.co||""; if(b) b.src=SEAL.p||""; },250);
});
$("#modal").addEventListener("change",async e=>{
  const pk=e.target.dataset.pimg;
  if(pk && e.target.files[0]){ const [i,f]=pk.split("."); try{ S.products[Number(i)][f]=await shrinkImage(e.target.files[0],360); persist(); openProducts(); render(); }catch(err){} return; }
  const key=e.target.dataset.img; if(!key||!e.target.files[0]) return;
  const r=new FileReader(); r.onload=async()=>{ S.company[key]=r.result; persist(); await refreshSeals(); const a=$("#pvCo"), b=$("#pvP"); if(a) a.src=SEAL.co||""; if(b) b.src=SEAL.p||""; }; r.readAsDataURL(e.target.files[0]);
});
$("#modal").addEventListener("click",async e=>{
  if(e.target===$("#modal") || e.target.closest("[data-close]")){ $("#modal").hidden=true; $("#modal").innerHTML=""; return; }
  if(e.target.closest("[data-addprod]")){ S.products.unshift({id:"p"+Date.now().toString(36),name:"",spec:"",unit:"台",price:0,img:"",img2:"",acc:"",specs:""}); persist(); openProducts(); return; }
  if(e.target.closest("[data-resetprod]")){ const def=DEFAULT_PRODUCTS(); def.forEach(dp=>{ const i=S.products.findIndex(p=>p.id===dp.id); if(i>=0) S.products[i]=dp; else S.products.push(dp); }); persist(); openProducts(); render(); return; }
  const dp=e.target.closest("[data-delprod]");
  if(dp){ if(!dp.dataset.armed){ dp.dataset.armed="1"; dp.textContent="再按一次刪除"; dp.style.fontSize="12px"; return; } S.products.splice(Number(dp.dataset.delprod),1); persist(); openProducts(); render(); return; }
  const c2=e.target.closest("[data-clrimg2]");
  if(c2){ S.products[Number(c2.dataset.clrimg2)].img2=""; persist(); openProducts(); render(); return; }

    const msg=$("#folderMsg"); msg.textContent="建立中…";
